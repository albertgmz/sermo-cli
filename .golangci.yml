version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - gocognit
    - misspell
    - bodyclose
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
  exclusions:
    generated: lax
    paths:
      - internal/api/gen

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
